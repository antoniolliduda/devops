<svg xmlns="http://www.w3.org/2000/svg" width="480" height="480" viewBox="0 0 480 480">
<!-- Padrão de fundo: um símbolo simples de cada ferramenta (Git, Docker, Linux, Kubernetes).
     Só contorno em cinza translúcido pra funcionar nos dois temas. -->
<g fill="none" stroke="#8b949e" stroke-opacity="0.12" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">

  <!-- Git: três commits ligados por uma ramificação -->
  <g transform="translate(40 40)">
    <circle cx="20" cy="15" r="9"/>
    <circle cx="20" cy="95" r="9"/>
    <circle cx="80" cy="45" r="9"/>
    <path d="M20 24V86"/>
    <path d="M20 70C20 55 45 60 71 48"/>
  </g>

  <!-- Docker: caixas empilhadas (containers) sobre uma onda -->
  <g transform="translate(290 50)">
    <rect x="0" y="30" width="28" height="24"/>
    <rect x="32" y="30" width="28" height="24"/>
    <rect x="64" y="30" width="28" height="24"/>
    <rect x="32" y="2" width="28" height="24"/>
    <path d="M-12 74C20 100 70 100 110 62"/>
  </g>

  <!-- Linux: pinguim simplificado -->
  <g transform="translate(60 290)">
    <ellipse cx="45" cy="55" rx="38" ry="52"/>
    <ellipse cx="45" cy="68" rx="22" ry="34"/>
    <circle cx="35" cy="30" r="4"/>
    <circle cx="55" cy="30" r="4"/>
    <path d="M39 40H51L45 49Z"/>
  </g>

  <!-- Kubernetes: roda de leme com 7 raios -->
  <g transform="translate(320 300)">
    <circle cx="50" cy="50" r="44"/>
    <circle cx="50" cy="50" r="12"/>
    <path d="M50 38V6M58.4 41.2L84 21M60.4 49.4L92 56M55.6 58.5L72 86M44.4 58.5L28 86M39.6 49.4L8 56M41.6 41.2L16 21"/>
  </g>
</g>
</svg>
